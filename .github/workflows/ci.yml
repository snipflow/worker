name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test and validate Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_CONFIG: ./wrangler.ci.jsonc
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Wrangler types
        run: pnpm exec wrangler --config "$WRANGLER_CONFIG" types --env-interface CloudflareBindings

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Validate Worker bundle
        run: pnpm exec wrangler --config "$WRANGLER_CONFIG" deploy --dry-run --minify
